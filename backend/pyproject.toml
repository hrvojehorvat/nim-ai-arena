[project]
name = "nim-arena-backend"
version = "0.1.0"
description = "Nim AI Arena backend: authoritative game server + LangGraph agents"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
